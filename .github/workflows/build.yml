name: Lint & Build

on:
    pull_request:
        branches: ["main"]

jobs:
    build:
        runs-on: ubuntu-latest

        strategy:
            matrix:
                node-version: [22.x]

        steps:
            - uses: actions/checkout@v3
              with:
                  fetch-depth: 0

            - name: Set up Node.js
              uses: actions/setup-node@v3
              with:
                  node-version: ${{ matrix.node-version }}
                  cache: "npm"

            - name: Install dependencies
              run: npm ci

            - name: Lint application
              run: npm run lint

            - name: Check migrations (CLAUDE.md Rule 9)
              run: npm run check:migrations
              env:
                  MIGRATIONS_BASE_REF: origin/${{ github.base_ref }}

            - name: Build application
              run: npm run build
