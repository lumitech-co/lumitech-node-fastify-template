name: Self test

# Runs this branch's own node-ci.yml in the template.
on:
    pull_request:
        types: [opened, synchronize, reopened, ready_for_review]
        paths-ignore:
            ["**/*.md", "docs/**", ".vscode/**", ".idea/**", "LICENSE"]
    push:
        branches: [main]
        paths-ignore:
            ["**/*.md", "docs/**", ".vscode/**", ".idea/**", "LICENSE"]

permissions:
    contents: read

jobs:
    ci:
        if: ${{ github.repository == 'lumitech-co/lumitech-node-fastify-template' }}
        uses: ./.github/workflows/node-ci.yml
        secrets: inherit
