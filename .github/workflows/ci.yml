name: CI

# node-ci.yml runs a push only on the default branch; add it below if it is not listed.
on:
    pull_request:
        types: [opened, synchronize, reopened, ready_for_review]
        paths-ignore:
            ["**/*.md", "docs/**", ".vscode/**", ".idea/**", "LICENSE"]
    push:
        branches: [main, master, dev, develop]
        paths-ignore:
            ["**/*.md", "docs/**", ".vscode/**", ".idea/**", "LICENSE"]

permissions:
    contents: read

jobs:
    ci:
        # The template runs self-test.yml instead.
        if: ${{ github.repository != 'lumitech-co/lumitech-node-fastify-template' }}
        uses: lumitech-co/lumitech-node-fastify-template/.github/workflows/node-ci.yml@main
        secrets: inherit
