name: Unit Tests

on:
    # Every pull request, whatever branch it targets, plus the merged result on main.
    pull_request:
    push:
        branches: [main]

jobs:
    test:
        runs-on: ubuntu-latest

        strategy:
            matrix:
                node-version: [22.x]

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ matrix.node-version }}
                  cache: "npm"

            - name: Install dependencies
              run: npm i

            - name: Run unit tests
              run: npm run test:unit:ci
