# Postgres is not here: the integration lane starts its own throwaway instance
# with Testcontainers (test/int/setup/global.ts). These are the emulators that
# have no in-process equivalent.
services:
    gcp-storage:
        image: fsouza/fake-gcs-server:1.52.2
        container_name: test-gcp-storage
        restart: no
        command: -scheme http -public-host localhost:4443 -port 4443
        ports:
            - "4443:4443"
        expose:
            - "4443"
        volumes:
            - "./.volumes/test-gcp-storage:/data"

    aws-s3:
        image: localstack/localstack:3.8.1
        container_name: test-aws-s3
        restart: no
        environment:
            SERVICES: "s3"
            AWS_DEFAULT_REGION: "us-east-1"
            AWS_S3_BUCKET_NAME: "test-bucket"
        ports:
            - "4566:4566"
        expose:
            - "4566"
        volumes:
            - "./scripts/init-s3.sh:/etc/localstack/init/ready.d/init-s3.sh"

    redis:
        image: redis:7.4-alpine
        container_name: test-redis
        restart: no
        ports:
            - "6380:6379"
        expose:
            - "6379"
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 2s
            timeout: 3s
            retries: 10
